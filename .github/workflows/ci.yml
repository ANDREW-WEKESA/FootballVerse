name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run flake8
        working-directory: backend
        run: flake8 .

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: footballverse
          POSTGRES_PASSWORD: footballverse
          POSTGRES_DB: footballverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footballverse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://footballverse:footballverse@localhost:5432/footballverse_test
      JWT_SECRET: ci-test-secret
      ADMIN_EMAIL: admin@footballverse.test
      ADMIN_PASSWORD: ci-test-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v
